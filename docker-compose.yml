name: traceforge

services:
  postgres:
    image: postgres:16
    container_name: traceforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-traceforge}
    ports:
      # Host 5433 avoids the native PostgreSQL service on 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - traceforge_pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first initialised; creates traceforge_test.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  traceforge_pgdata:
    name: traceforge_pgdata
